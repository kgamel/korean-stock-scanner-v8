<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국주식 급등 선행 스캐너 V8</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
    header { margin-bottom: 20px; }
    header h1 { font-size: 1.3rem; color: #f0f6fc; display: flex; align-items: center; gap: 8px; }
    header p { font-size: 0.8rem; color: #8b949e; margin-top: 4px; }
    
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 1rem; color: #58a6ff; margin-bottom: 12px; }
    .card p { font-size: 0.85rem; color: #8b949e; line-height: 1.4; margin-bottom: 12px; }
    
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #238636; color: #ffffff; }
    .btn-primary:disabled { background: #23863680; cursor: not-allowed; }
    .btn-auto { background: #1f6beb; color: #ffffff; margin-bottom: 10px; }
    
    label { display: block; font-size: 0.85rem; color: #8b949e; margin: 12px 0 6px; }
    select { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .stat-box { background: #0d1117; padding: 12px; border-radius: 8px; border: 1px solid #30363d; }
    .stat-box .title { font-size: 0.75rem; color: #8b949e; }
    .stat-box .num { font-size: 1.2rem; font-weight: bold; color: #f0f6fc; margin-top: 4px; }
    
    .stock-item { background: #0d1117; border: 1px solid #30363d; padding: 12px; border-radius: 8px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
    .up { color: #f85149; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>📈 한국주식 급등 선행 스캐너 V8</h1>
    <p>휴대폰용 · 자동 시세 분석 · 결과 조회</p>
  </header>

  <!-- 1. 데이터 불러오기 -->
  <section class="card">
    <h2>1. 데이터 불러오기</h2>
    <p>CSV 파일 없이 인터넷에서 실시간 주식 데이터를 자동으로 수집하여 분석합니다.</p>
    <button class="btn btn-auto" id="autoBtn" onclick="fetchAutoData()">⚡ 실시간 주식 데이터 자동 불러오기</button>
    <div id="dataStatus" style="font-size: 0.8rem; color: #a5d6ff;">데이터 미수집 상태</div>
  </section>

  <!-- 2. 분석 조건 -->
  <section class="card">
    <h2>2. 분석 조건</h2>
    <label>최소 점수</label>
    <select id="minScore">
      <option value="60">60점 이상</option>
      <option value="70">70점 이상</option>
      <option value="80">80점 이상</option>
    </select>

    <label>표시 종목 수</label>
    <select id="displayCount">
      <option value="10">10개</option>
      <option value="30" selected>30개</option>
      <option value="50">50개</option>
    </select>

    <button class="btn btn-primary" style="margin-top: 16px;" id="scanBtn" onclick="runAnalysis()" disabled>급등 선행 신호 분석</button>
  </section>

  <!-- 3. 분석 결과 -->
  <section class="card">
    <h2>3. 분석 결과</h2>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="title">분석 종목</div>
        <div class="num" id="totalCount">0</div>
      </div>
      <div class="stat-box">
        <div class="title" id="scoreLabel">60점 이상</div>
        <div class="num" id="passedCount">0</div>
      </div>
    </div>
    <div id="resultList" style="margin-top: 12px;"></div>
  </section>

  <script>
    const sampleStocks = [
      { name: '삼성전자', code: '005930' },
      { name: 'SK하이닉스', code: '000660' },
      { name: 'NAVER', code: '035420' },
      { name: '카카오', code: '035720' },
      { name: '현대차', code: '005380' },
      { name: '기아', code: '000270' },
      { name: 'POSCO홀딩스', code: '005490' },
      { name: 'LG에너지솔루션', code: '373220' }
    ];

    let loadedData = [];

    async function fetchAutoData() {
      const autoBtn = document.getElementById('autoBtn');
      const dataStatus = document.getElementById('dataStatus');
      const scanBtn = document.getElementById('scanBtn');

      autoBtn.disabled = true;
      dataStatus.innerText = "데이터를 수집하는 중입니다...";
      loadedData = [];

      for (let i = 0; i < sampleStocks.length; i++) {
        const item = sampleStocks[i];
        dataStatus.innerText = `[${i + 1}/${sampleStocks.length}] ${item.name} 데이터 수집 중...`;
        
        try {
          const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${item.code}.KS?interval=1d&range=5d`;
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
          const response = await fetch(proxyUrl);
          const data = await response.json();
          const contents = JSON.parse(data.contents);
          const prices = contents.chart.result[0].indicators.quote[0].close;
          
          const currentPrice = prices[prices.length - 1];
          const prevPrice = prices[prices.length - 2];
          const changeRate = ((currentPrice - prevPrice) / prevPrice) * 100;
          
          const score = Math.min(100, Math.max(40, Math.floor(60 + changeRate * 5 + Math.random() * 10)));

          loadedData.push({
            name: item.name,
            code: item.code,
            price: currentPrice,
            changeRate: changeRate,
            score: score
          });
        } catch (e) {
          console.error(e);
        }
      }

      dataStatus.innerText = `총 ${loadedData.length}개 종목 데이터 수집 완료!`;
      document.getElementById('totalCount').innerText = loadedData.length;
      autoBtn.disabled = false;
      scanBtn.disabled = false;
    }

    function runAnalysis() {
      const minScore = parseInt(document.getElementById('minScore').value);
      const displayCount = parseInt(document.getElementById('displayCount').value);
      const resultList = document.getElementById('resultList');
      
      document.getElementById('scoreLabel').innerText = `${minScore}점 이상`;
      resultList.innerHTML = "";

      const filtered = loadedData.filter(d => d.score >= minScore).slice(0, displayCount);
      document.getElementById('passedCount').innerText = filtered.length;

      if (filtered.length === 0) {
        resultList.innerHTML = `<div style="text-align:center; padding: 20px; color:#8b949e;">조건에 맞는 종목이 없습니다.</div>`;
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'stock-item';
        div.innerHTML = `
          <div>
            <div style="font-weight:bold; color:#f0f6fc;">${item.name} <span style="font-size:0.75rem; color:#8b949e;">(${item.code})</span></div>
            <div style="font-size:0.8rem; color:#58a6ff; margin-top:2px;">점수: ${item.score}점</div>
          </div>
          <div style="text-align:right;">
            <div class="${item.changeRate >= 0 ? 'up' : ''}">${item.price.toLocaleString()}원</div>
            <div style="font-size:0.8rem;" class="${item.changeRate >= 0 ? 'up' : ''}">${item.changeRate >= 0 ? '+' : ''}${item.changeRate.toFixed(2)}%</div>
          </div>
        `;
        resultList.appendChild(div);
      });
    }
  </script>
</body>
</html>
