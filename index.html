<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국주식 급등 검색기</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #fff; font-family: sans-serif; padding: 15px; }
    header h1 { font-size: 1.4rem; text-align: center; color: #4caf50; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    h2 { font-size: 1.1rem; margin-top: 0; color: #ffd700; }
    button { width: 100%; padding: 12px; background: #4caf50; border: none; color: white; font-weight: bold; border-radius: 5px; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #555; }
    #resultList { margin-top: 10px; }
    .stock-item { background: #2a2a2a; padding: 10px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; }
    .up { color: #ff5252; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>📈 한국주식 급등 자동 검색기</h1>
  </header>

  <section class="card">
    <h2>1. 실시간 급등주 자동 스캔</h2>
    <p style="font-size: 0.85rem; color: #ccc;">CSV 파일 업로드 없이 인터넷 데이터로 자동 검색합니다.</p>
    <button id="scanBtn" onclick="startAutoScan()">⚡ 급등 가능 종목 자동 검색</button>
  </section>

  <section class="card">
    <h2>2. 검색 결과</h2>
    <div id="status">버튼을 누르면 검색을 시작합니다.</div>
    <div id="resultList"></div>
  </section>

  <script>
    // 스캔할 관심/주요 종목 코드 목록 (예시)
    const stockList = [
      { name: '삼성전자', code: '005930' },
      { name: 'SK하이닉스', code: '000660' },
      { name: 'NAVER', code: '035420' },
      { name: '카카오', code: '035720' },
      { name: '현대차', code: '005380' }
    ];

    async function fetchStockData(symbol) {
      try {
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}.KS?interval=1d&range=5d`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        
        const response = await fetch(proxyUrl);
        if (!response.ok) return null;
        
        const data = await response.json();
        const contents = JSON.parse(data.contents);
        const result = contents.chart.result[0];
        const prices = result.indicators.quote[0].close;
        
        const currentPrice = prices[prices.length - 1];
        const prevPrice = prices[prices.length - 2];
        const changeRate = ((currentPrice - prevPrice) / prevPrice) * 100;

        return { currentPrice, prevPrice, changeRate };
      } catch (e) {
        return null;
      }
    }

    async function startAutoScan() {
      const btn = document.getElementById('scanBtn');
      const status = document.getElementById('status');
      const resultList = document.getElementById('resultList');

      btn.disabled = true;
      status.innerText = "데이터 분석 중입니다... 잠시만 기다려주세요.";
      resultList.innerHTML = "";

      let count = 0;
      for (const item of stockList) {
        status.innerText = `[${item.name}] 데이터 분석 중... (${++count}/${stockList.length})`;
        const data = await fetchStockData(item.code);

        if (data) {
          const div = document.createElement('div');
          div.className = 'stock-item';
          const isUp = data.changeRate >= 0;
          div.innerHTML = `
            <span><strong>${item.name}</strong> (${item.code})</span>
            <span class="${isUp ? 'up' : ''}">${data.currentPrice.toLocaleString()}원 (${data.changeRate.toFixed(2)}%)</span>
          `;
          resultList.appendChild(div);
        }
      }

      status.innerText = "스캔 완료!";
      btn.disabled = false;
    }
  </script>
</body>
</html>
